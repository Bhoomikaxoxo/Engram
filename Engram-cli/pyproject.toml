[project]
name = "engram-cli"
version = "0.2.1"
description = "A terminal for Engram — memory that reasons."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Plastic Labs", email = "hello@plasticlabs.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0.0",
    "typer>=0.15.0",
    "engram-ai>=2.5.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/plastic-labs/engram"
Repository = "https://github.com/plastic-labs/engram"

[project.scripts]
engram = "engram_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/engram_cli/local/templates/docker-compose.yml" = "engram_cli/local/templates/docker-compose.yml"
"src/engram_cli/local/templates/init.sql" = "engram_cli/local/templates/init.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
