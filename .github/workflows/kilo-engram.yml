name: kilo-engram

on:
  push:
    branches: [main]
    paths:
      - 'kilo-engram/**'
      - '.github/workflows/kilo-engram.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kilo-engram/**'
      - '.github/workflows/kilo-engram.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kilo-engram
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Build and test
        run: bun run test
